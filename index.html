<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRAIN BET — Player</title><script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script><script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script><style>
:root{--bg:#070b16;--panel:#101827;--line:#26364f;--text:#f7f9ff;--muted:#94a4c0;--blue:#2d7dff;--gold:#ffc928;--green:#36d68b;--red:#ff6878}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#112a5e,#070b16 60%);font-family:Inter,system-ui,Arial;color:var(--text);display:grid;place-items:center;padding:20px}.app{width:min(720px,100%)}.top{text-align:center;margin-bottom:18px}.brand{font-size:25px;font-weight:950;letter-spacing:.16em}.brand span{color:var(--gold)}.card{background:#0e1726ee;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 25px 70px #0007}.step{display:flex;gap:7px;margin-bottom:18px}.step i{height:5px;flex:1;background:#24334b;border-radius:9px}.step i.on{background:var(--blue)}.title{font-size:25px;font-weight:950}.sub{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.5}.row{display:flex;gap:9px}.stack{display:grid;gap:12px}label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#72839f;font-weight:950}input,textarea{width:100%;padding:12px;border-radius:10px;background:#080f1c;color:#fff;border:1px solid #2b3c58;outline:0;font:inherit}textarea{min-height:120px;resize:vertical}.btn{padding:12px 15px;border-radius:10px;border:1px solid #334660;background:#1a2940;color:#fff;font-weight:900;cursor:pointer}.btn.primary{background:var(--blue);border-color:#5796ff}.btn.gold{background:var(--gold);color:#111}.codeInput{font-size:27px;letter-spacing:.18em;text-align:center;font-weight:950}.range{accent-color:var(--gold);width:100%}.confrow{display:flex;align-items:center;justify-content:space-between}.conf{font-size:30px;color:var(--gold);font-weight:950}.status{margin-top:13px;padding:10px 12px;border-radius:9px;background:#111d31;color:#9db0cd;font-size:12px}.status.good{background:#103b2b;color:#7be8b6}.status.bad{background:#481a23;color:#ff9ca7}.rooms{display:grid;gap:8px;margin-top:12px}.room{border:1px solid #263850;background:#0a1321;border-radius:10px;padding:11px;display:flex;align-items:center;justify-content:space-between;gap:10px}.room b{font-size:12px}.room small{display:block;color:#70829e;margin-top:3px}.reaction-bar{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:14px}.reaction{font-size:24px;padding:10px 4px;border:1px solid #2b3c58;background:#0a1321;border-radius:10px}.reaction:active{transform:scale(.94)}.hint{font-size:10px;color:#70819d;margin-top:8px} .app{max-width:680px}.top{padding-top:8px}.brand{font-size:22px;letter-spacing:.12em}.card{padding:28px;border-radius:22px;background:#0b1321}.btn{min-height:46px;border-radius:12px}.reaction{min-height:52px;border-radius:12px}.codeInput{min-height:56px} </style></head><body><div class="app"><div class="top"><div class="brand">BRAIN <span>BET</span></div><div class="sub">Know it. Bet it.</div></div><div class="card"><div class="step"><i id="s1" class="on"></i><i id="s2"></i><i id="s3"></i></div><div id="root"></div></div></div><script>
const $=id=>document.getElementById(id);let peer=null,conn=null,gameCode='',score=0,scanStream=null,scanTimer=null,playerName='',currentQid=null;function show(html,step=1){$('root').innerHTML=html;['s1','s2','s3'].forEach((x,i)=>$(x).classList.toggle('on',i<step))}function connect(codeOverride){const code=String(codeOverride||$('code')?.value||'').trim().toUpperCase();if($('name'))playerName=$('name').value.trim();const name=playerName||'Player';if(!code)return;gameCode=code;peer=new Peer();peer.on('open',()=>{conn=peer.connect('brainbet-'+code.toLowerCase());const timer=setTimeout(()=>{show('<div class="title">Could not connect</div><div class="sub">That room did not respond. Try another room or code.</div><button class="btn" onclick="location.reload()" style="margin-top:15px">Try Again</button>',1)},7000);conn.on('open',()=>{clearTimeout(timer);conn.send({type:'join',name});show(`<div class="title">You're in!</div><div class="sub">Wait for the host to start the next question.</div><div class="status good">Connected to ${esc(gameCode)}</div>${reactionButtons()}`,2)});conn.on('data',handle);conn.on('close',()=>show('<div class="title">Disconnected</div><div class="sub">The connection to the host was closed.</div>',1))});peer.on('error',()=>show('<div class="title">Could not connect</div><div class="sub">Check the game code and try again.</div><button class="btn" onclick="location.reload()" style="margin-top:15px">Try Again</button>',1))}function handle(d){if(!d||typeof d!=='object')return;if(d.type==='joined'){score=0;currentQid=null}if(d.type==='cancel'){currentQid=null;show(`<div class="title">Round cancelled</div><div class="sub">Wait for the host to start the next question.</div>${reactionButtons()}`,2)}if(d.type==='rejected'&&(!d.questionId||d.questionId===currentQid)){show(`<div class="title">Not accepted</div><div class="sub">${d.reason==='already-locked'?'You already locked an answer for this question.':'That question is closed.'}</div>${reactionButtons()}`,2)}if(d.type==='question'){currentQid=d.questionId||null;show(`<div class="title">Question ${d.index+1}</div><div class="sub">Base score: ${d.baseScore}</div><div style="font-size:25px;font-weight:900;line-height:1.15;margin:20px 0">${esc(d.question)}</div><label>Your answer</label><textarea id="answer" placeholder="Type your answer…"></textarea><div class="confrow"><label>Confidence</label><div class="conf" id="cv">50</div></div><input id="confidence" class="range" type="range" min="0" max="100" value="50" oninput="$('cv').textContent=this.value"><button class="btn primary" style="width:100%;margin-top:15px" onclick="submitAnswer()">Lock In Answer</button>${reactionButtons()}`,3)}if(d.type==='locked'&&d.questionId===currentQid)show(`<div class="title">LOCKED IN</div><div class="sub">Your answer has been submitted.</div><div class="status good">WAIT FOR THE REVEAL</div>${reactionButtons()}`,2);if(d.type==='reveal'&&(!currentQid||d.questionId===currentQid))show(`<div class="title">Answer revealed</div><div class="sub">The correct answer is</div><div style="font-size:38px;font-weight:950;color:var(--gold);margin:25px 0">${esc(d.answer)}</div><div class="status">Waiting for the host to grade the round…</div>${reactionButtons()}`,2);if(d.type==='result'){score=d.newScore;if(d.questionId&&currentQid&&d.questionId!==currentQid)return;show(`<div class="title">${d.correct?'Correct!':'Not quite.'}</div><div class="sub">${d.correct?'You gained':'You lost'} ${Math.abs(d.delta)} points.</div><div style="font-size:48px;font-weight:950;color:var(--gold);margin:20px 0">${score}</div><div class="status ${d.correct?'good':'bad'}">${d.correct?'CORRECT':'WRONG'}</div>${reactionButtons()}`,2)}if(d.type==='finished')show(`<div class="title">Game over</div><div class="sub">Final score</div><div style="font-size:55px;font-weight:950;color:var(--gold);margin:20px 0">${score}</div>`,2)}function reactionButtons(){return '<div class="hint">React to the show</div><div class="reaction-bar"><button class="reaction" onclick="react(\'❤️\')">❤️</button><button class="reaction" onclick="react(\'👍\')">👍</button><button class="reaction" onclick="react(\'🤮\')">🤮</button><button class="reaction" onclick="react(\'😡\')">😡</button><button class="reaction" onclick="react(\'😄\')">😄</button></div>'}let lastReaction=0;function react(emoji){if(Date.now()-lastReaction<450)return;lastReaction=Date.now();if(conn?.open)conn.send({type:'reaction',emoji})}function submitAnswer(){const answer=$('answer').value.trim(),confidence=Number($('confidence').value);if(!answer||!currentQid||!conn?.open)return;conn.send({type:'submit',questionId:currentQid,answer,confidence});show(`<div class="title">Answer locked</div><div class="sub">Confidence: ${confidence}</div><div class="status good">Sending to the host…</div>${reactionButtons()}`,2)}function findRooms(){if($('name'))playerName=$('name').value.trim();show(`<div class=\"title\">Find My Room</div><div class=\"sub\">Scan the QR code shown on the Host screen. No room directory or nearby-device scanning is required.</div><div class=\"stack\" style=\"margin-top:18px\"><button class=\"btn primary\" onclick=\"startScanner()\">Scan QR Code</button><div class=\"hint\">Camera scanning requires browser permission and usually HTTPS or localhost.</div><div class=\"status\">Or enter the 6-character room code manually below.</div><input id=\"manualRoomCode\" class=\"codeInput\" maxlength=\"6\" placeholder=\"ABC123\"><button class=\"btn\" onclick=\"connect(document.getElementById('manualRoomCode').value)\">Connect with Code</button></div>`,1)}
function stopScanner(){if(scanTimer){clearInterval(scanTimer);scanTimer=null}if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null}}
async function startScanner(){show(`<div class=\"title\">Scan Room QR</div><div class=\"sub\">Point your camera at the QR code on the Host screen.</div><video id=\"scanVideo\" autoplay playsinline style=\"width:100%;margin-top:15px;border-radius:12px;background:#000;max-height:55vh;object-fit:cover\"></video><div class=\"status\" id=\"scanStatus\">Requesting camera…</div><button class=\"btn\" style=\"margin-top:10px\" onclick=\"stopScanner();findRooms()\">Cancel</button>`,1);try{if(!navigator.mediaDevices?.getUserMedia)throw new Error('Camera unavailable');scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});const v=$('scanVideo');v.srcObject=scanStream;await v.play();const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});scanTimer=setInterval(()=>{if(!v.videoWidth)return;canvas.width=v.videoWidth;canvas.height=v.videoHeight;ctx.drawImage(v,0,0,canvas.width,canvas.height);const img=ctx.getImageData(0,0,canvas.width,canvas.height);const code=window.jsQR?.(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});if(code?.data){const m=code.data.match(/^BRAINBET:([A-Z0-9]{6})$/i);if(m){stopScanner();connect(m[1]);}else{$('scanStatus').textContent='That QR code is not a BRAIN BET room.'}}},150)}catch(e){$('scanStatus').textContent='Camera scanning is unavailable here. Use the room code instead.'}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}show(`<div class="title">Join a game</div><div class="sub">Enter your name, then use a code or find rooms that are advertising themselves.</div><div class="stack" style="margin-top:18px"><label>Your name</label><input id="name" placeholder="Your name"><label>Game code</label><input id="code" class="codeInput" maxlength="6" placeholder="ABC123"><div class="row"><button class="btn primary" style="flex:1" onclick="connect()">Join Game</button><button class="btn" style="flex:1" onclick="findRooms()">Find My Room</button></div><div class="hint">Find My Room uses a QR code displayed by the Host. No room directory is used.</div></div>`,1);
</script></body></html>
